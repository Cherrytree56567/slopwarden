[package]
name = "clientwarden-ui"
version = "0.1.0"
authors = ["CT5"]
edition = "2024"
publish = false

# The Linux and Windows desktop app: an iced UI over the vault core's C API
# (src/Platforms/Shared/CApi), linked from libclientwarden built by CMake.

[[bin]]
name = "clientwarden"
path = "UI/main.rs"

[dependencies]
iced = { version = "0.14", features = ["tokio"] }
serde_json = "1"
directories = "6"
zeroize = "1"
arboard = "3"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
strip = true
lto = "thin"
