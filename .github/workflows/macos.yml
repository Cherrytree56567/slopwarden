name: macOS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Conan
      run: pipx install conan==2.29.1 && conan profile detect

    - name: Cache Conan packages
      uses: actions/cache@v4
      with:
        path: ~/.conan2/p
        key: macos-conan-v1-${{ hashFiles('conanfile.py') }}
        restore-keys: macos-conan-v1-

    - name: Install dependencies
      run: conan install . --output-folder=build --build=missing -s compiler.cppstd=20 -s build_type=${{ env.BUILD_TYPE }}

    - name: Configure
      run: |
        cmake -S . -B build -G Xcode -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_TOOLCHAIN_FILE=build/build/${{ env.BUILD_TYPE }}/generators/conan_toolchain.cmake

    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }} -- CODE_SIGNING_ALLOWED=NO

    - uses: actions/upload-artifact@v4
      with:
        name: ClientWarden-macos
        path: build/${{ env.BUILD_TYPE }}
